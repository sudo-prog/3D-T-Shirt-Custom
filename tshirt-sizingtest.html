<head>
  <title>Verge3D Web Interactive</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

  <!-- Search Engines -->
  <meta name="description"
    content="Interactive 3D Web application made with Verge3D. Immerse yourself in amazing graphics experience offered by state-of-the art WebGL and HTML5 technologies.">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Verge3D Web Interactive">
  <meta name="twitter:description"
    content="Interactive 3D Web application made with Verge3D. Immerse yourself in amazing graphics experience offered by state-of-the art WebGL and HTML5 technologies.">
  <meta name="twitter:image:src" content="https://cdn.soft8soft.com/images/player_socials.jpg">
  <!-- Open Graph -->
  <meta property="og:title" content="Verge3D Web Interactive">
  <meta property="og:description"
    content="Interactive 3D Web application made with Verge3D. Immerse yourself in amazing graphics experience offered by state-of-the art WebGL and HTML5 technologies.">
  <meta property="og:image" content="https://cdn.soft8soft.com/images/player_socials.jpg">
  <meta property="og:type" content="website">

  <meta name="generator" content="Verge3D 4.5.1">

  <!-- favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="media/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="media/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="media/favicon-16x16.png">
  <link rel="manifest" href="media/manifest.json">
  <link rel="mask-icon" href="media/safari-pinned-tab.svg" color="#0048a5">
  <meta name="theme-color" content="#ffffff">

  <script src="v3d.js"></script>
  <script src="tshirt-sizingtest.js"></script>

  <link rel="stylesheet" type="text/css" href="tshirt-sizingtest.css">
</head>

<body>
  <div id="v3d-container">
    <div id="fullscreen-button" class="fullscreen-button fullscreen-open" title="Toggle fullscreen mode"></div>
    <div id="myClass" style="position: fixed; bottom: 0px; height: fit-content; display: block;"><input type="checkbox"
        class="cl-input-responsive" id="inputResponsive">
      <div class="cf_drawer" id="cf_drawer1">
        <div class="cf_canvas__wrapper" id="cf_root1" style="width: 100%; height: 100%;">
          <div class="konvajs-content" role="presentation"
            style="position: relative; user-select: none; width: 450px; height: 450px; background-image: url(&quot;./canvas_bg/placementguide.jpg&quot;); background-size: cover;">
            <canvas width="3600" height="3600" id="cf_canvas1" data-stage="cf_stage1"
              style="padding: 0px; margin: 0px; border: 0px; background: transparent; position: absolute; top: 0px; left: 0px; width: 450px; height: 450px; display: block;"></canvas>
          </div>
          <div class="cf_tools-container">
            <div class="cf_tools-toggle"></div>
            <div class="cf_tools-wrapper">
              <div class="cf_block cf_drawing">


                <input id="cf_drawing-enable1" type="checkbox" class="cf_drawing-enable" data-stage="cf_stage1">
                <label class="cf_label cf_label-checkbox" for="cf_drawing-enable1"></label>

                <input id="cf_drawing-color1" type="color" class="cf_drawing-color" data-stage="cf_stage1">
                <label class="cf_label cf_label-color" for="cf_drawing-color1"></label>

                <input id="cf_drawing-size1" type="number" class="cf_drawing-size" step="0.1" min="0.1" value="1"
                  data-stage="cf_stage1">
                <label class="cf_label cf_label-number" for="cf_drawing-size1"></label>
                <button id="closecanvas" class="cf_button" style="margin-left: 220px;">X</button>
              </div>
              <div class="cf_block cf_text">

                <button class="cf_button cf_text-add">Add Text</button>

                <input type="color" class="cf_text-color" data-stage="cf_stage1">
                <label class="cf_label cf_label-color"></label>

                <input type="number" class="cf_text-size" step="1" min="1" value="12" data-stage="cf_stage1">
                <label class="cf_label cf_label-number"></label>


                <div class="cf_row" style="margin-top: 6px;">
                  <select class="cf_input cf_text-font" style="margin-left: 8px;">
                    <option value="Arial">Arial</option>
                    <option value="Courier">Courier</option>
                    <option value="Georgia">Georgia</option>
                    <option value="'Roboto', sans-serif" selected="">Roboto</option>
                    <option value="Times New Roman">Times New Roman</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; flex-direction: row;">
                <div class="cf_block cf_image">

                  <label class="cf_button cf_image-wrapper">
                    Upload Design
                    <input type="file" class="cf_image-source"></label>
                </div>
                <div class="cf_block cf_state-controls">
                  <button id="exportButton" class="cf_button"> Save Layout</button><button id="importButton"
                    class="cf_button">Load Layout</button><button class="cf_button cf_state-reset">Reset</button>
                </div>
              </div>
            </div>
          </div>
          <div class="cf_context-menu" style="display: none;">
            <div class="cf_button cf_context-menu__button" data-action="up">Layer Up</div>
            <div class="cf_button cf_context-menu__button" data-action="down">Layer Down</div>
            <div class="cf_button cf_context-menu__button" data-action="remove">Remove</div>
          </div>
        </div>
      </div>
    </div>
    <div id="myClass2"></div>

  </div>
</body>

</html>
